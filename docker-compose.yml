name: projeto-sistema-financeiro

services:
  bancoDeDados:
    container_name: bd_postgres
    image: postgres:16.3

    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-db_sistema_financeiro}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: "no"

    networks:
      - postgres-compose-network

volumes:
  postgres-data:

networks:
  postgres-compose-network:
    driver: bridge