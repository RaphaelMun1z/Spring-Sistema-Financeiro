api:
  security:
    token:
      secret: ${JWT_SECRET:segredo-local-exclusivo-desenvolvimento}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200,http://localhost:3000}
  data-mock:
    enabled: ${DATA_MOCK_ENABLED:false}
