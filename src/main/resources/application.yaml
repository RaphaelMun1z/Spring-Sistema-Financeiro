server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: gestao-financeira
  profiles:
    active: dev

api:
  security:
    token:
      secret: ${JWT_SECRET:chave-jwt}

springdoc:
  pathsToMatch: /**
  swagger-ui:
    use-root-path: true

management:
  endpoints:
    web:
      exposure:
        include: health
      base-path: /actuator
  endpoint:
    health:
      show-details: always

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200,http://localhost:3000}