spring:
  application:
    name: gestao-financeira
  datasource:
    url: jdbc:postgresql://${CLOUD_POSTGRES_HOST}:${CLOUD_POSTGRES_PORT}/${CLOUD_POSTGRES_DB}
    username: ${CLOUD_POSTGRES_USER}
    password: ${CLOUD_POSTGRES_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true

server:
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
