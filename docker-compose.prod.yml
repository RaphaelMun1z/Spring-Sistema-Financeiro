name: projeto-sistema-financeiro-prod

services:
  aplicacao:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATA_MOCK_ENABLED: ${DATA_MOCK_ENABLED:-false}

      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_POLL_INTERVAL_MS: ${TELEGRAM_BOT_POLL_INTERVAL_MS:-1500}

      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-}

      CLOUD_POSTGRES_HOST: ${CLOUD_POSTGRES_HOST}
      CLOUD_POSTGRES_PORT: ${CLOUD_POSTGRES_PORT}
      CLOUD_POSTGRES_DB: ${CLOUD_POSTGRES_DB}
      CLOUD_POSTGRES_USER: ${CLOUD_POSTGRES_USER}
      CLOUD_POSTGRES_PASSWORD: ${CLOUD_POSTGRES_PASSWORD}

      INITIAL_USER_ENABLED: ${INITIAL_USER_ENABLED:-false}
      INITIAL_USER_NAME: ${INITIAL_USER_NAME:-}
      INITIAL_USER_EMAIL: ${INITIAL_USER_EMAIL:-}
      INITIAL_USER_PASSWORD: ${INITIAL_USER_PASSWORD:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    restart: unless-stopped
